server:
  port: 8080

spring:
  application:
    name: contest-mate-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contestmate}
    username: ${DB_USER:contestmate}
    password: ${DB_PASSWORD:contestmate}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always

contest-mate:
  daytona:
    api-key: ${DAYTONA_API_KEY:}
  openai:
    # Set OPENAI_API_KEY on the server only. Never ship an API key in the Android app or the GPU worker image.
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
  llm:
    # OpenAI-compatible endpoint. Point this at a self-hosted vLLM/Ollama server (e.g. running on Nosana)
    # or at OpenAI directly. Left blank => heuristic fallback extraction/recommendation reasons are used.
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    chat-model: ${LLM_CHAT_MODEL:llama3.1}
    embedding-model: ${LLM_EMBEDDING_MODEL:nomic-embed-text}
    embedding-dimension: ${LLM_EMBEDDING_DIMENSION:768}
    timeout-ms: ${LLM_TIMEOUT_MS:20000}
  dedup:
    similarity-threshold: ${DEDUP_SIMILARITY_THRESHOLD:0.90}
  collector:
    enabled: ${COLLECTOR_ENABLED:true}
    # cron: every 30 minutes by default
    cron: ${COLLECTOR_CRON:0 */30 * * * *}
  seed:
    enabled: ${SEED_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
